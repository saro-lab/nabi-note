<!doctype html>
<!--
  CDN 예문 — **이 한 장이 곧 설치 설명서다.**

  빌드도, 번들러도, import 도 없다. `<link>` 하나와 `<script>` 하나면 편집기가 선다. 아래 스크립트는
  일부러 평범한 옛 JS 다(모듈도, 화살표 밖의 문법도 안 쓴다) — 베껴 붙일 사람의 페이지가 어떤
  상태든 그대로 돌아야 하기 때문이다.

  `npm run build:cdn` 이 이 파일과 `cdn.css`·`sample.js` 를, 빌드가 낸
  `nabi-note.min.js`·`nabi.css` 와 함께 `cdn/dist/` 에 모은다. 그 폴더는 그대로 올리면 된다.
  경로가 전부 상대이고 **모듈도 fetch 도 안 쓰므로** 서버 없이 파일로 열어도(file://) 선다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NABI NOTE — CDN</title>
  <link rel="stylesheet" href="./nabi.css" />
  <link rel="stylesheet" href="./cdn.css" />
</head>
<body>
  <main>
    <header class="page-head">
      <h1><a href="https://nabi.saro.me/">NABI NOTE</a></h1>
      <p class="lead">태그 둘이 곧 설치다 — 빌드도 번들러도 없다.</p>
      <pre class="install"><code>&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nabi-note/dist/nabi.css"&gt;
&lt;script src="https://cdn.jsdelivr.net/npm/nabi-note"&gt;&lt;/script&gt;</code></pre>
      <p class="note">
        내보내는 것 전부가 전역 <code>NabiNote</code> 하나에 걸린다.
        <label class="theme"><input type="checkbox" id="dark" /> 어두운 화면</label>
      </p>
    </header>

    <!-- 편집기의 뼈대 — 크롬(툴바 + 상황 줄)과 쓰는 자리. 클래스 이름이 시트의 손잡이다. -->
    <div id="app" class="nabi">
      <div id="chrome" class="nabi-toolbar">
        <div id="toolbar"></div>
        <div id="context"></div>
      </div>
      <div id="content" class="nabi-content" contenteditable="true"></div>
    </div>

    <section class="panes">
      <div>
        <h2>getHtml() — 저장·발행하는 값</h2>
        <pre id="out-html"></pre>
      </div>
      <div>
        <h2>getJson() — 나비트리</h2>
        <pre id="out-json"></pre>
      </div>
    </section>
  </main>

  <script src="./sample.js"></script>
  <script src="./nabi-note.min.js"></script>
  <script>
    (function () {
      'use strict';
      var N = NabiNote;
      var $ = function (id) { return document.getElementById(id); };

      // 1. 편집기 하나 — 날개 목록이 갈래 지식·커맨드·조립기를 함께 짓는다.
      var made = N.createNabiWith(N.defaultWings, {
        doc: window.NABI_SAMPLE,
        parseHtml: N.parseNodes,
        // 묻는 길 — 안 주면 코어는 아무것도 안 묻고 "아니오" 로 답한다(머리 없는 곳에서도 도니까).
        ask: {
          message: function (text) { window.alert(text); },
          confirm: function (text) { return window.confirm(text); }
        }
      });
      var nabi = made.nabi;
      var registry = made.registry;

      // 2. 시트는 `nabi.css` 로 이미 걸려 있다 — 여기서는 주입하지 않는다.
      //    (묶음만 쓰고 시트를 손수 붙이고 싶으면 `N.injectSheets(document, N.collectSheets(registry))`.)

      // 3. 표면과 줄 둘. 상황 줄은 캐럿이 선 자리를 따라 저 혼자 채워진다.
      N.mountSurface({ nabi: nabi, registry: registry, root: $('content') });
      var settle = N.watchSettle(document, { surface: $('content') });
      var shared = { nabi: nabi, registry: registry, surface: $('content'), settle: settle, locale: 'ko' };
      // 로컬 기록 — IndexedDB 에 지정된 간격으로 스냅샷을 남긴다. **저장소는 호스트가 준다**
      // (`browserHistoryStorage`). `file://` 로 연 페이지에서는 브라우저가 저장소를 막으므로
      // 저장소가 살아 있지 않다고 답하고, 그때 단추를 누르면 `openHistoryPanel` 이 판 대신
      // toast 한 마디를 띄운다 — "서버에 올려서 열어라". 배선을 안 하면 단추가 무반응이다.
      var history = N.mountLocalHistory({ nabi: nabi, storage: N.browserHistoryStorage(window) });

      var toolbar = N.mountToolbar(Object.assign({ root: $('toolbar'), onHost: function (w) {
        if (w !== 'localHistory') return;
        N.openHistoryPanel({
          history: history,
          surface: $('content'),
          locale: 'ko',
          sessionId: history.sessionId,
          // 미리보기 — 기록의 값을 보기 HTML 로 그린다(편집기를 새로 세우지 않는다).
          render: function (record) {
            return N.createNabiWith(N.defaultWings, { doc: JSON.parse(record.body) }).nabi.getHtml();
          }
        });
      } }, shared));
      var context = N.mountContextToolbar(Object.assign({ root: $('context') }, shared));
      // 미리보기·전체화면 두 단추 — 툴바 줄의 끝(방향 쪽 모서리)에 저 혼자 상자를 세워 앉는다.
      // `root` 는 전체화면이 걸리는 자리라 크롬과 쓰는 자리를 함께 품은 `.nabi` 뿌리다.
      N.mountViewTools(Object.assign({ root: $('app'), container: $('toolbar') }, shared));

      // Shift 두 번 → 단추마다 한 글자 배지.
      N.mountHints({ toolbar: toolbar, context: context, root: $('chrome'), surface: $('content') });
      // 그림·영상을 누르면 골라졌다고 화면이 말한다(브라우저는 그 위에 선택을 안 그린다).
      N.mountPickedMark({ nabi: nabi, surface: $('content') });

      // 4. 값 — 바뀔 때마다 두 얼굴을 함께 보인다. 호스트가 저장하는 것은 왼쪽이다.
      function show() {
        $('out-html').textContent = nabi.getHtml();
        $('out-json').textContent = JSON.stringify(nabi.getJson(), null, 1);
      }
      nabi.onChange(show);
      show();

      // 테마는 `.dark` 클래스 하나다 — 미디어 쿼리가 아니다(호스트가 제 규칙을 쓸 수 있게).
      $('dark').addEventListener('change', function (event) {
        document.documentElement.classList.toggle('dark', event.target.checked);
      });
    }());
  </script>
</body>
</html>
