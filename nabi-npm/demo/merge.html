<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문서 머지 · NABI NOTE</title>
    <style>
      body {
        margin: 0;
        padding: 1.5rem;
        color: #202127;
        background: #f7f7fa;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 100rem;
        margin: auto;
      }
      header p {
        max-width: 55rem;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-block: 1rem;
      }
      .controls button,
      .controls select {
        padding: 0.45rem 0.7rem;
        font: inherit;
      }
      #demo-state {
        margin-inline-start: auto;
        font-size: 0.875rem;
      }
      #merge-host {
        background: white;
      }
      #confirmed {
        margin-top: 1.5rem;
        padding: 1rem;
        background: white;
        border: 1px solid #ddd;
      }
      #confirmed[hidden] {
        display: none;
      }
      #confirmed h2 {
        margin-top: 0;
      }
      #confirmed-json {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="./">NABI NOTE</a>
        <h1>세 문서 머지</h1>
        <p>
          겹치지 않는 변경은 먼저 합칩니다. 남은 충돌은 왼쪽의 시작 내용이나 오른쪽의 반영된 내용을 고르거나, 가운데에서
          직접 고친 뒤 ‘현재 내용으로 해결’을 누르세요.
        </p>
        <div class="controls">
          <label
            >예시
            <select id="scenario">
              <option value="conflicts">충돌과 자동 머지가 함께 있는 문서</option>
              <option value="automatic">자동으로 모두 합칠 수 있는 문서</option>
            </select></label
          >
          <button id="reset" type="button">다시 시작</button>
          <button id="undo" type="button">되돌리기</button>
          <button id="redo" type="button">다시 하기</button>
          <output id="demo-state" aria-live="polite"></output>
        </div>
      </header>
      <div id="merge-host"></div>
      <section id="confirmed" hidden aria-labelledby="confirmed-title">
        <h2 id="confirmed-title">확인한 문서</h2>
        <article id="confirmed-html" class="nabi-content"></article>
        <details>
          <summary>저장할 JSON 보기</summary>
          <pre id="confirmed-json"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="./merge.ts"></script>
  </body>
</html>
